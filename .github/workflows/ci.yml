name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A superseded push should stop costing money. Without this, pushing twice to
  # an open PR leaves the first run burning minutes to completion for a commit
  # nobody is waiting on any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung job would eat a fifth of the
    # monthly allowance before anyone noticed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate HTML files exist
        run: |
          count=$(find . -name "*.html" | wc -l)
          echo "Found $count HTML files"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No HTML files found"
            exit 1
          fi
